# Coach 全局配置
app:
  name: "AI王者荣耀决策思维教练"
  codename: "Coach"
  version: "0.2.0"          # 阶段2/3引擎已接通

paths:
  data_dir: "data"
  replays_dir: "data/replays"
  knowledge_base_dir: "knowledge_base"
  prompts_dir: "prompts"

# LLM 配置（OpenAI兼容接口；tech spec选型 DeepSeek / 通义千问，均兼容）
# 未配置API key时自动进入降级模式（规则归因+知识库原文，无AI点评）。
llm:
  base_url: "https://api.deepseek.com/v1"    # 或通义: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: "deepseek-chat"                     # 通义可用 qwen-plus
  api_key_env: "COACH_LLM_API_KEY"           # 在环境变量中设置key，不写进文件
  timeout_sec: 120
  # 视觉模型：HUD KDA读数、战绩截图OCR（DeepSeek无视觉，默认走通义qwen-vl）
  # 注意：Model Studio的key分两种——通用DashScope key用下面这个通用域名；
  # "工作空间专属"(Token Plan/dedicated workspace)key必须用控制台API-Key
  # 弹窗里显示的专属域名（形如 ws-xxxxx.ap-southeast-1.maas.aliyuncs.com），
  # 通用域名会直接401。当前这个key是工作空间专属的，见下方实际配置。
  vision:
    base_url: "https://ws-yfy87cpz51i0gg8r.us-east-1.maas.aliyuncs.com/compatible-mode/v1"
    model: "qwen3-vl-plus"    # qwen-vl-plus是旧代模型，官方示例已全面转向qwen3-vl系列
                               # （便宜/快速可选qwen3-vl-flash，效果稍弱）
    api_key_env: "COACH_VLM_API_KEY"         # 缺省回落到COACH_LLM_API_KEY
  # 视觉兜底：Qwen踩过账号未开通/模型未购买的坑（AccessDenied.Unpurchased），
  # 加一个独立厂商的兜底，主视觉模型失败时自动切换，两边都没配key就不启用，
  # 不影响原本"未配置视觉key就跳过视觉功能"的降级行为。
  vision_fallback:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    timeout_sec: 120

# 视频检测区域（AGE-49：基于验证素材1290×2796竖屏录屏标定，
# 换设备/游戏UI改版后需重新标定）
video:
  # 2026-08-21实测切换：同一帧（01-16-28录屏 ts=300, 肉眼可读K=0,D=0,A=1）
  # 用真实生产prompt（_KDA_PROMPT）问VLM，模型回答"null"（声称读不出来）；
  # 换一个措辞不同的prompt问同一张图，又能读对——跟AGE-136记录的VLM不稳定
  # 问题（同一帧多次调用给出不同答案/偶发拒绝）完全对得上，不是crop/配置
  # 问题。这正是extract_death_events在Grace真实录屏上报告"0死亡"（她记得
  # 明明死过）的根因：粗采样12个点大量因VLM"null"回答而被跳过，死亡计数
  # 递增窗口检测不到。模板法在同一张图上确定性读出(0,0,1)，跟人眼一致。
  # 默认改为template。
  kda_reader: template   # vlm | template；AGE-136模板法已验证优于VLM，改为默认
  hud_crop:      {x: 1650, y: 0, w: 650, h: 140}   # KDA计数器区域
  minimap_crop:  {x: 0,    y: 0, w: 420, h: 320}   # 小地图区域
  # AGE-247：玩家视角的小地图会将己方水晶规范化到左下、敌方水晶到右上。
  # 下面是在三份真实录屏的420x320 minimap_crop坐标系中手工标定的
  # 河道中心线（从左下到右上）。点位用归一化坐标，以允许等比缩放。
  minimap_orientation: player_normalized_friendly_bottom_left
  river_centerline_normalized:
    - [0.405, 1.000]
    - [0.500, 0.844]
    - [0.607, 0.688]
    - [0.714, 0.531]
    - [0.821, 0.375]
    - [0.929, 0.219]
    - [1.000, 0.116]
  # AGE-236: in the calibrated 420x320 crop, a visible ally farther than this
  # radius is treated as no nearby support. Real-video spot checks separated a
  # clearly grouped sample (~74px) from a dispersed sample (~125px); 90px keeps
  # the boundary between them. This remains a coarse proxy, not a claim that
  # minimap distance exactly equals effective support distance.
  ally_isolation_distance_px: 90
  # AGE-237：位移阈值要由经验标定或游戏数值提供；未标定时生产路径必须拒绝猜测。
  minimap_pixels_per_world_unit: null
  hero_max_move_speed_world_units_sec: null
  anomalous_displacement_multiplier: 1.5
  # AGE-140标定完成（2026-08-17）：在ScreenRecording_08-12-2026 02-03-33_1.MP4
  # 三个独立死亡事件（ts=308/316/712）上核实"查看死亡回放"横幅+倒计时数字
  # 的真实像素位置，坐标系为ffmpeg按rotate元数据归一化后的2796x1290画面
  # （grab_respawn_frame/detect_death_marker均在此坐标系下工作）。三次读数
  # 位置完全一致，裁剪框留有余量以覆盖1-2位数倒计时。另两份录屏
  # （08-11 15-57、08-12 01-16，同设备同分辨率）HUD版式核对一致，未在其中
  # 逐一验证独立死亡帧——AGE-141的端到端检测结果是真正的跨录屏验证。
  # extract_death_location已加安全防护（见video_utils.respawn_crop_is_calibrated）：
  # respawn_crop_calibrated为false时整体跳过"复活HUD共现"特征、只用死亡前
  # 基线+位置持续性过滤（不会因为占位坐标读不到倒计时而把所有真实死亡X
  # 标记都误判为噪点拒绝，那等于把召回率打到接近0）。
  # 标定 = 同时做两件事：把下面四个坐标改成真实值，并把
  # respawn_crop_calibrated改成true。开关是唯一的判定依据——坐标漂一个
  # 像素不会被当成"已标定"，也就不会静默打开那条召回崩塌的路径。
  respawn_crop:  {x: 1280, y: 0, w: 300, h: 140}    # 复活倒计时区域（AGE-140已标定，2026-08-17）
  respawn_crop_calibrated: true                       # 标定完真实坐标后改true
  coarse_interval_sec: 75
  precision_sec: 3
  # FrameHopper粗采样步长：1=处理每个已调度的粗采样帧（与现有行为完全一致）；
  # N>1=仅解码/读取每N个粗采样帧。首帧、尾帧和命中窗口的二分精定位帧
  # 不跳过；死亡计数单调，因此跳过的静态HUD粗采样点不会改变事件数。
  frame_skip_stride: 1
  # AGE-242：仅跳过KDA数字槽视觉上未变的完整读数；疑似变化始终强制读取。
  # 真实模板reader A/B总耗时反而+11.6%，因此默认不开；远程VLM reader可显式开启。
  frame_skip_enabled: false
  frame_skip_threshold: 1.0

# 语音层已移出MVP（实现计划v1.0调整1），v1.1+再启用
voice:
  enabled: false

# 数据情报管线（intake/run_intake.py）：双周抓取版本/攻略动态，起草知识库
# 更新草案到 knowledge_base/_pending_updates/，人工审核后合并，绝不自动写入
# macro_principles.md 等正式文件。设计上由 GitHub Actions 定时触发（见
# .github/workflows/hok-intake.yml），也可本地手动运行。
intake:
  # 检索层：智谱GLM，自带web_search插件，能访问中文网站（官网/贴吧/B站相关讨论等）
  search:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    model: "glm-4-plus"
    api_key_env: "ZHIPU_API_KEY"
    timeout_sec: 120
  # 检索兜底：GLM单条查询失败/无结果时，用Qwen(DashScope) enable_search重试一次。
  # 未设置DASHSCOPE_API_KEY时，自动复用上面llm.vision.api_key_env那个DashScope
  # key（同一供应商），两边都没配就直接不启用兜底，不影响主流程。
  # base_url同上面vision段的注意事项——工作空间专属key要用专属域名，不能用
  # 通用dashscope.aliyuncs.com（会401）。
  search_fallback:
    base_url: "https://ws-yfy87cpz51i0gg8r.us-east-1.maas.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
    api_key_env: "DASHSCOPE_API_KEY"
    timeout_sec: 120
  # 起草层：DeepSeek，把检索结果整理成符合知识库schema的条目草案
  draft:
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    api_key_env: "DEEPSEEK_API_KEY"
    timeout_sec: 180
  lookback_days: 14
